<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143e32" />
    <meta
      name="description"
      content="JSS Polytechnic for Differently Abled Students — hostel administration, mess attendance and fee accounting."
    />
    <title>JSS PDA Hostel</title>
    <!-- Link previews when a sponsorship page is shared. -->
    <meta property="og:site_name" content="JSS PDA Hostel" />
    <meta property="og:title" content="Sponsor a student at JSS PDA Hostel" />
    <meta
      property="og:description"
      content="Help a differently abled student at JSS Polytechnic continue their studies by sponsoring their hostel fees."
    />
    <meta
      property="og:image"
      content="https://hostel360-nine.vercel.app/campus.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved (or system) theme before the first paint.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("h360_theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23143e32'/%3E%3Cpath d='M10 29V13l10-5 10 5v16H10zm7-12v4h6v-4zm0 8v4h6v-4z' fill='%23c5ed9b'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
